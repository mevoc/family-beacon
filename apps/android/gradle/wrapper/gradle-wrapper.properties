# Gradle 9.5.0 is the floor AGP 9.3.1 sets, not a preference — the plugin's own
# version check refuses anything older. Bump the two together.
#
# The checksum is not decoration: the wrapper downloads and then executes this
# distribution, and `validateDistributionUrl` alone would only establish that it
# came from the right host.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
