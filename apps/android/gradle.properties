org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Which ABIs to cross-compile the Rust core for.
#
# Both by default: `arm64-v8a` is every phone worth targeting and `x86_64` is the
# emulator. CI overrides this to one ABI — every extra ABI is another full
# cross-compile of vodozemac, rustls and ring, and the android job is already the
# slowest in the file.
#
#     ./gradlew assembleDebug -Pbeacon.abis=arm64-v8a
#
# `armeabi-v7a` is deliberately absent. Add it only when a real family phone
# needs it.
beacon.abis=arm64-v8a,x86_64
