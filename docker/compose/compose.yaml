# Family Beacon — deployment profile B (the recommended one).
#
# Sund behind Caddy on a real domain with WebPKI TLS on port 443. See
# ../../ARCHITECTURE.md → Deployment for why this is recommended over the
# domain-less profile A, and ../caddy/Caddyfile for the proxy configuration.
#
#   cp .env.example .env      # then edit: your domains and ACME email
#   docker compose up -d
#   docker compose exec sund /sund admin account create
#
# The last command prints the account id and the first invitation; that
# invitation plus the server address is what the first device's QR carries.
# In this profile the server address is the WebPKI form — no fingerprint:
#
#   sund+webpki://beacon.example.org
#
# (Sund-Pinning-Contract.md §8.1. Do NOT hand out a sund://…#fingerprint
# address here; that is profile A's form and clients reject the mismatch.)
#
# Prerequisites compose cannot provide: a domain, A/AAAA records pointing at
# this host, and ports 80 and 443 reachable from the internet.

name: family-beacon

services:
  # --- the relay ----------------------------------------------------------
  sund:
    image: ${SUND_IMAGE:-ghcr.io/mevoc/sund:latest}
    restart: unless-stopped
    volumes:
      - sund-data:/data
    environment:
      SUND_ADDR: ":5870"
      SUND_DB: "/data/sund.db"
      # SUND_TLS_DIR is deliberately unset. Sund speaks plain HTTP here and
      # Caddy terminates TLS; running Sund's pinned listener behind the proxy
      # as well would be double TLS with a certificate no client is pinning.
    # No `ports:` — the relay is reachable only through Caddy. Publishing 5870
    # to the host would expose plain HTTP to anything that can reach this box
    # and quietly undo the proxy.
    expose:
      - "5870"
    networks:
      - edge
    # distroless has no shell or curl, so the binary probes itself.
    healthcheck:
      test: ["CMD", "/sund", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # --- Android wake-up (UnifiedPush distributor) --------------------------
  #
  # Optional. Delete this service and its Caddyfile block to use a public
  # distributor (ntfy.sh) instead — pings are payload-free, so a public
  # distributor learns wake timing and nothing else. iOS wake-up does not come
  # from here at all; it needs a vendor-operated APNS gateway (Sund PRD, Push
  # architecture).
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: ["serve"]
    environment:
      # Must match the public URL, because ntfy hands this base URL to the
      # phone as its UnifiedPush endpoint — and that endpoint string is what
      # Sund later POSTs to.
      NTFY_BASE_URL: "https://${NTFY_DOMAIN}"
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      # Wake-ups are transient: a ping that arrives after the device has
      # already drained its queues is worthless, so keep almost nothing.
      NTFY_CACHE_DURATION: "12h"
      NTFY_AUTH_FILE: "/var/lib/ntfy/auth.db"
      # Anonymous read-write. UnifiedPush topic names are long random strings
      # generated by the distributor, so this is obscurity, not access control:
      # anyone who learns a topic can send spurious wake-ups to that device.
      # They carry no content and cannot inject anything into Sund — the cost
      # is battery and needless queue polls. To close it, set this to deny-all
      # and create a user (`docker compose exec ntfy ntfy user add …`), then
      # enter those credentials in the UnifiedPush distributor app on each
      # device.
      NTFY_AUTH_DEFAULT_ACCESS: "read-write"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ATTACHMENT_CACHE_DIR: ""
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    expose:
      - "80"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- TLS termination ----------------------------------------------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"    # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the ACME account key and issued certificates. Losing
      # it means re-issuing on next start, which is survivable but counts
      # against Let's Encrypt rate limits — keep it a named volume, not tmpfs.
      - caddy-data:/data
      - caddy-config:/config
      # Uncomment together with the web-client block in the Caddyfile:
      # - ../../apps/web/dist:/srv/web:ro
    environment:
      BEACON_DOMAIN: ${BEACON_DOMAIN:?set BEACON_DOMAIN in .env}
      NTFY_DOMAIN: ${NTFY_DOMAIN:-ntfy.invalid}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Empty in production. Only compose.ci.yaml sets it, to `tls internal`,
      # so CI can exercise this exact Caddyfile without a domain or ACME.
      CADDY_TLS: ${CADDY_TLS:-}
    depends_on:
      - sund
    networks:
      edge:
        # This alias is what makes self-hosted push work on one box, and it is
        # the least obvious line in this file.
        #
        # Sund does not push to ntfy over the internal network: it POSTs to the
        # endpoint URL each device registered, and that is the *public* ntfy
        # URL (https://${NTFY_DOMAIN}/up…), because the phone's distributor is
        # what minted it. So Sund's request has to leave for the public name
        # and come back — which on a typical home router fails, since few of
        # them hairpin NAT back to the LAN.
        #
        # Aliasing the public hostname to the Caddy container inside the
        # compose network makes Sund resolve it locally instead. TLS still
        # verifies: it reaches the same Caddy, presenting the same real
        # certificate for that name. No hairpin, no split-horizon DNS, no
        # exception in Sund.
        aliases:
          - ${NTFY_DOMAIN:-ntfy.invalid}

networks:
  edge:

volumes:
  sund-data:
  ntfy-cache:
  ntfy-auth:
  caddy-data:
  caddy-config:
