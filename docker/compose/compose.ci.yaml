# Family Beacon — CI stack.
#
# Stands up the profile B topology (sund + ntfy + caddy) without a domain,
# without ACME and without anything reachable from the internet, so that CI can
# assert the parts of the deployment that are actually falsifiable:
#
#   - the services come up healthy and in the right order
#   - Caddy routes both hostnames and passes request paths through UNREWRITTEN
#     (a correctness requirement — devices sign the path; see ../caddy/Caddyfile)
#   - an oversized request body is refused (by Sund's cap, not Caddy's — see
#     the note in the CI workflow's assertion)
#   - the ntfy network alias resolves inside the compose network, which is the
#     least obvious line in compose.yaml and the likeliest to break silently
#
# It deliberately layers on the production compose.yaml and the production
# Caddyfile rather than copying them. A CI-only copy would drift from the real
# thing and then vouch for nothing.
#
# What it does NOT test: ACME certificate issuance, real DNS, and internet
# reachability. Those need a real domain and are out of CI's reach by nature.
#
# Usage — note both -f files and the --env-file, all three are required:
#
#   docker compose --env-file docker/compose/.env.ci \
#     -f docker/compose/compose.yaml \
#     -f docker/compose/compose.ci.yaml up -d --wait
#
# `--wait` blocks until every service reports healthy, which is what makes
# Sund's self-probing `health` subcommand pay off.
#
# The hostnames, the internal CA and the pinned Sund image all come from
# .env.ci, not from overrides here: compose interpolates each file before
# merging, so an `environment:` block in this file would be too late to satisfy
# compose.yaml's own ${BEACON_DOMAIN:?…} and — the one that actually bites —
# the ${NTFY_DOMAIN} in the network alias. See that file's header.
#
# Then, to talk to the stack over TLS, export Caddy's local CA root:
#
#   docker compose --env-file docker/compose/.env.ci -f … cp \
#     caddy:/data/caddy/pki/authorities/local/root.crt ./ci-root.crt
#   curl --cacert ./ci-root.crt --resolve beacon.test:443:127.0.0.1 \
#     https://beacon.test/health
#
# .env.ci pins SUND_IMAGE to a commit, so a red build means your change broke,
# not that Sund moved. The scheduled canary overrides it with :latest from the
# shell environment on purpose — that job exists to find out that Sund broke
# its first consumer.

services:
  sund:
    # Nothing to override: the production service already runs plain HTTP behind
    # Caddy, which is exactly what CI wants. Publish the port too, so contract
    # tests can also hit the relay directly, bypassing the proxy, and tell the
    # two layers' failures apart.
    ports:
      - "127.0.0.1:5870:5870"

  caddy:
    # Caddy must resolve its own hostnames for the ntfy leg; the alias in
    # compose.yaml handles ntfy.test, and this covers anything resolving
    # beacon.test inside the network.
    extra_hosts:
      - "beacon.test:127.0.0.1"
    healthcheck:
      # Prove the proxy is actually serving TLS for the Sund vhost, not merely
      # that the process started. --no-check-certificate is fine here and only
      # here: the certificate is from Caddy's own ephemeral CI CA, and the
      # assertion is reachability and routing, not trust. Tests that verify
      # trust use the exported root above.
      test:
        - "CMD"
        - "wget"
        - "--no-check-certificate"
        - "--spider"
        - "-q"
        - "https://beacon.test/health"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
