[package]
name = "contract-tests"
version = "0.1.0"
description = "Tier 2 of docs/FamilyBeacon-Testing.md: sund-client against a real Sund relay"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sund-client = { path = "../sund-client" }

[dev-dependencies]
# Only the tests need it, and only the sessions leg: it is what makes that leg
# drive the *whole* stack — envelope, session, real relay, back to envelope —
# rather than asserting that ciphertext survives a round trip.
beacon-protocol = { path = "../beacon-protocol" }
beacon-roster = { path = "../beacon-roster" }
base64 = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
